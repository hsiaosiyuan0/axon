name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: ""
          - os: darwin
            arch: amd64
            runner: macos-13
            ext: ""
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ""
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get install -y gcc

      - name: Install build deps (Windows)
        if: matrix.os == 'windows'
        run: choco install mingw -y

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5"
        run: >
          go build
          -tags "fts5"
          -ldflags "-s -w -X github.com/hsiaosiyuan0/axon/cmd.Version=${{ github.ref_name }}"
          -o axon-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: axon-${{ matrix.os }}-${{ matrix.arch }}
          path: axon-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create checksums
        working-directory: dist
        run: sha256sum axon-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/axon-linux-amd64
            dist/axon-linux-arm64
            dist/axon-darwin-amd64
            dist/axon-darwin-arm64
            dist/axon-windows-amd64.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
