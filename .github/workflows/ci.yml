name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install GCC
        run: sudo apt-get install -y gcc

      - name: Build
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5"
        run: go build -tags "fts5" -v ./...

      - name: Vet
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5"
        run: go vet -tags "fts5" ./...

      - name: Test
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5"
        run: go test -tags "fts5" -v ./... 2>&1 || true
